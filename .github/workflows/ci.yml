name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  npm-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/npm-metadata.test.mjs
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: '22.16.0'
            php: '8.2'
          - node: '24'
            php: '8.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, pdo_sqlite, zip, pcntl
          tools: composer:v2
          coverage: none
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
